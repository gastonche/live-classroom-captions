# Builds the desktop captions app for macOS (Apple Silicon), Windows (x64) and Linux (x64).
# On a version tag (v*), also publishes them as a GitHub pre-release with docs/release-notes.md.
# The speech models are not built in: the app downloads them on first run.
name: Desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src-tauri/**', 'src/**', 'overlay/**', 'wordlists/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
            artifact: Captions-macOS-arm64
          - os: windows-latest
            bundles: nsis
            artifact: Captions-Windows-x64
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: Captions-Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies (WebKitGTK, tray, ALSA audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Web page for the app (and size budgets)
        run: npm run build
      - name: Fetch the speech engine's native library afresh
        # The Rust cache can restore sherpa-onnx-sys without the library its build script
        # downloaded ("could not find native static library sherpa-onnx-c-api").
        working-directory: src-tauri
        run: cargo clean --release -p sherpa-onnx-sys
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --release
      - name: Build the app
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Collect the downloadable files
        shell: bash
        run: |
          mkdir -p out
          B=src-tauri/target/release/bundle
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$RUNNER_OS" in
            macOS)   (cd $B/macos && ditto -c -k --keepParent Captions.app "$GITHUB_WORKSPACE/out/Captions-$V-macOS-arm64.zip") ;;
            Windows) cp $B/nsis/*.exe "out/Captions-$V-Windows-x64-setup.exe" ;;
            Linux)   cp $B/appimage/*.AppImage "out/Captions-$V-Linux-x64.AppImage"; cp $B/deb/*.deb "out/Captions-$V-Linux-x64.deb" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          merge-multiple: true
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-desktop
          gh release create "$GITHUB_REF_NAME" dist-desktop/* \
            --title "Captions $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md \
            --prerelease
