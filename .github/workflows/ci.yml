# Tests, size budgets (fail the build when exceeded) and end-to-end checks on every push and PR.
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check, build and size budgets
        run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end (dev server, local signalling)
        run: npm run e2e
      - name: End-to-end (production build, service worker)
        run: npm run e2e:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
