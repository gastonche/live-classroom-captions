# Tests, size budgets (fail the build when exceeded) and end-to-end checks on every push and PR.
# WebKit e2e is informational for now: on GitHub's runners (Linux and macOS) two WebKit pages
# don't connect over WebRTC, though they do on a real Mac and iPhone. See NOTES.md. Run
# `npx playwright test --project=webkit` on a Mac before releases.
name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check, build and size budgets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, production build (service worker, offline)
        run: npm run e2e:prod

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          - browser: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end (${{ matrix.browser }}, local signalling)
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
