<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Captions">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../view.webmanifest">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<title>Captions: follow along</title>
<link rel="stylesheet" href="../src/ui.css">
</head>
<body>
  <main id="join">
    <h1 data-i18n="viewTitle">Follow the captions</h1>
    <p class="muted" data-i18n="enterCode">Enter the code shown on the screen</p>
    <input id="code" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Room code">
    <p id="join-error" class="error" role="alert"></p>
    <button id="connect" class="btn primary" data-i18n="join">Join</button>
  </main>

  <main id="main" hidden>
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <p id="state" class="state muted" hidden></p>
  </main>
  <script type="module" src="../src/view/main.ts"></script>
</body>
</html>
