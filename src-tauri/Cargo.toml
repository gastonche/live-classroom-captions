[package]
name = "captions-overlay"
version = "0.1.0"
description = "Live Classroom Captions: caption overlay for the projector computer"
license = "MIT"
edition = "2021"

[lib]
name = "captions_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.8"
cpal = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSScreen", "NSWorkspace", "NSPanel"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSValue", "NSArray", "NSNotification", "NSOperation", "block2"] }
block2 = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
