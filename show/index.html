<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<title>Captions screen</title>
<link rel="stylesheet" href="../src/show/show.css">
</head>
<body>
  <main id="pair" class="screen">
    <p class="label" data-i18n="roomCode">Room code</p>
    <p id="code" class="code" aria-live="polite">····</p>
    <div class="qr-box"><canvas id="qr" width="1" height="1" aria-hidden="true"></canvas></div>
    <p class="hint" data-i18n="pairHint"></p>
    <p class="hint" id="view-hint"></p>
  </main>

  <main id="live" class="screen" hidden>
    <div id="stage" class="stage" aria-live="polite"></div>
    <p id="notice" class="notice" hidden></p>
  </main>

  <div id="net" class="net" data-state="connecting" aria-hidden="true"><span id="net-code"></span></div>
  <script type="module" src="../src/show/main.ts"></script>
</body>
</html>
